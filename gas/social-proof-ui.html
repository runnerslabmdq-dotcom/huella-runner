<!-- ============================================================

     ============================================================ -->
<script>
// ---------------------------------------------------------------
// SOCIAL PROOF — Mostrar banner al registrar zapatilla
// ---------------------------------------------------------------

// Llama a esta función en lugar de google.script.run.addShoe(...)
function registrarZapatillaConSocialProof(email, marca, modelo, talle, genero, imagenUrl) {
  // Mostrar loader / deshabilitar botón (usa la lógica existente)
  mostrarLoader && mostrarLoader();

  google.script.run
    .withSuccessHandler(function(res) {
      ocultarLoader && ocultarLoader();

      if (!res || !res.success) {
        mostrarError(res && res.error ? res.error : 'Error al registrar la zapatilla.');
        return;
      }

      // Cerrar modal de registro si existe
      if (typeof cerrarModalAgregarZapa === 'function') cerrarModalAgregarZapa();

      // Mostrar banner de Social Proof
      if (res.socialProof) {
        spMostrarBanner(marca, modelo, res.socialProof);
      }

      // Refrescar lista de zapatillas
      if (typeof loadShoes === 'function') loadShoes();
    })
    .withFailureHandler(function(err) {
      ocultarLoader && ocultarLoader();
      mostrarError('Error de conexión: ' + err.message);
    })
    .registrarZapatillaConProof(email, marca, modelo, talle, genero, imagenUrl);
}

// ---------------------------------------------------------------
// Muestra el banner con los datos reales
// ---------------------------------------------------------------
function spMostrarBanner(marca, modelo, proof) {
  const nombreModelo   = marca + ' ' + modelo;
  const usuarios       = proof.totalUsuarios    || 1;
  const kmTotal        = spFormatKm(proof.totalKmGlobales  || 0);
  const promedio       = proof.promedioKmCritico || 0;

  document.getElementById('spUsuarios').textContent = usuarios;
  document.getElementById('spModelo').textContent   = nombreModelo;
  document.getElementById('spKmTotal').textContent  = kmTotal;

  document.getElementById('spStatUsuarios').textContent = usuarios;
  document.getElementById('spStatKm').textContent       = kmTotal;

  const kmCriticoEl = document.getElementById('spKmCritico');
  if (promedio > 0) {
    document.getElementById('spKmCriticoVal').textContent = promedio;
    kmCriticoEl.style.display = 'flex';
  } else {
    kmCriticoEl.style.display = 'none';
  }

  document.getElementById('spOverlay').classList.add('sp-visible');
  document.body.style.overflow = 'hidden';
}

function spCerrarBanner() {
  document.getElementById('spOverlay').classList.remove('sp-visible');
  document.body.style.overflow = '';
}

// Cierra con click en overlay (fuera del banner)
document.getElementById('spOverlay').addEventListener('click', function(e) {
  if (e.target === this) spCerrarBanner();
});

// Formato de número con separador de miles
function spFormatKm(n) {
  return Math.round(n).toLocaleString('es-AR');
}

// ---------------------------------------------------------------
// ACORDEÓN — Renderizar en cada tarjeta de zapatilla activa
// ---------------------------------------------------------------

// Llamar al cargar cada tarjeta:
//   renderSocialProofAccordion(shoeId, marca, modelo, containerEl)
// donde containerEl es el DOM element de la tarjeta.

function renderSocialProofAccordion(shoeId, marca, modelo, containerEl) {
  // Evita duplicados
  if (containerEl.querySelector('.sp-accordion')) return;

  const accordionId = 'sp-acc-' + shoeId;
  const html = `
    <div class="sp-accordion" id="${accordionId}" data-loaded="false">
      <button class="sp-accordion__trigger"
              onclick="spToggleAccordion('${accordionId}', '${marca.replace(/'/g,"\\'")}', '${modelo.replace(/'/g,"\\'")}')">
        <span>¿Cómo rinde esta zapatilla en la comunidad?</span>
        <span class="sp-accordion__arrow">▼</span>
      </button>
      <div class="sp-accordion__body">
        <div class="sp-accordion__row">
          <span class="sp-accordion__key">Cargando...</span>
        </div>
      </div>
    </div>`;

  containerEl.insertAdjacentHTML('beforeend', html);
}

function spToggleAccordion(accordionId, marca, modelo) {
  const el = document.getElementById(accordionId);
  if (!el) return;

  const isOpen = el.classList.contains('open');

  if (isOpen) {
    el.classList.remove('open');
    return;
  }

  el.classList.add('open');

  // Carga los datos solo la primera vez
  if (el.dataset.loaded === 'false') {
    el.dataset.loaded = 'loading';

    google.script.run
      .withSuccessHandler(function(proof) {
        spRenderAccordionBody(el, proof);
        el.dataset.loaded = 'true';
      })
      .withFailureHandler(function() {
        spRenderAccordionBody(el, null);
        el.dataset.loaded = 'true';
      })
      .obtenerDataSocialProof(marca, modelo);
  }
}

function spRenderAccordionBody(el, proof) {
  const body = el.querySelector('.sp-accordion__body');
  if (!body) return;

  if (!proof) {
    body.innerHTML = '<div class="sp-accordion__row"><span class="sp-accordion__key">Sin datos disponibles aún.</span></div>';
    return;
  }

  const promedio = proof.promedioKmCritico > 0
    ? proof.promedioKmCritico + ' km'
    : 'Sin datos suficientes aún';

  body.innerHTML = `
    <div class="sp-accordion__row">
      <span class="sp-accordion__key">Runners que la usan</span>
      <span class="sp-accordion__val gold">${proof.totalUsuarios || 1}</span>
    </div>
    <div class="sp-accordion__row">
      <span class="sp-accordion__key">KM globales acumulados</span>
      <span class="sp-accordion__val">${spFormatKm(proof.totalKmGlobales || 0)} km</span>
    </div>
    <div class="sp-accordion__row">
      <span class="sp-accordion__key">Vida útil promedio en HR</span>
      <span class="sp-accordion__val gold">${promedio}</span>
    </div>`;
}
</script>
