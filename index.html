<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFD700">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HR">
  <title>Huella Runner</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-512.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .splash img {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(255,215,0,0.3);
    }
    .splash-title {
      font-size: 2rem;
      font-weight: 900;
      color: #E8E8E8;
      letter-spacing: -1px;
      text-align: center;
    }
    .splash-title span { color: #FFD700; }
    .splash-sub {
      font-size: 0.65rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .loader {
      width: 36px;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
    }
    .loader-bar {
      width: 40%;
      height: 100%;
      background: #FFD700;
      border-radius: 2px;
      animation: slide 1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <img src="./icons/icon-512.png" alt="Huella Runner">
    <div>
      <div class="splash-title">HUELLA <span>RUNNER</span></div>
      <div class="splash-sub">Powered by Open Sports</div>
    </div>
    <div class="loader"><div class="loader-bar"></div></div>
  </div>
  <script>
    // ⚠️ REEMPLAZÁ CON TU URL DE GAS
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw969Qmrwh9EaYZqo3OyyKkPYx1aJkFBdxYbVtYoTl6DGrxrgMNzt0NBuz85PPFjK04/exec';
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .catch(err => console.warn('SW:', err));
    }

    setTimeout(() => {
      window.location.replace(GAS_URL);
    }, 1200);
  </script>
</body>
</html>
