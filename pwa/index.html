<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C5B358">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HR">
  <title>Huella Runner</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-512.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .splash img {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(197,179,88,0.3);
    }
    .splash-title {
      font-size: 2rem;
      font-weight: 900;
      color: #E8E8E8;
      letter-spacing: -1px;
      text-align: center;
    }
    .splash-title span { color: #C5B358; }
    .splash-sub {
      font-size: 0.65rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .loader {
      width: 36px;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
    }
    .loader-bar {
      width: 40%;
      height: 100%;
      background: #C5B358;
      border-radius: 2px;
      animation: slide 1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    /* ── Aviso "navegador de adentro" (Instagram/Facebook/TikTok) ──
       Esos navegadores in-app no soportan bien "Agregar a pantalla de
       inicio" (ícono genérico, sin pantalla completa real) porque no son
       Chrome/Safari de verdad. No se puede forzar la salida (las apps lo
       bloquean a propósito).
       HISTORIA de este cartel (para no repetir el mismo error dos veces):
       1) Primera versión: pausaba el redirect y pedía elegir "salir a
          Chrome" o "continuar acá" — mucha fricción justo en la entrada.
       2) Segunda versión: sacó la pausa, entraba solo a los 3.5s — el
          fundador probó en el celu y no le daba tiempo ni a leerlo, se
          iba antes de terminar la frase.
       3) Esta versión (la que queda): sin cronómetro. Se muestra fijo,
          con un solo botón grande — entra recién cuando la persona lo
          toca, sin apuro. En cualquier otro navegador (fuera de
          Instagram/Facebook/TikTok) el comportamiento no cambió: sigue
          entrando solo a los 1.2s.
       4) 14/08/2026: texto cambiado de aviso técnico ("Estás entrando
          desde Instagram") a gancho de valor ("Un toque y ves cuántos
          km lleva tu zapatilla") — el aviso técnico no daba ningún
          motivo para tocar el botón. Sacado también el bloque de "cómo
          instalar" (quedaba como fricción extra justo en la entrada,
          nadie llega hasta acá para instalar) — esa info se comunica
          aparte, en un posteo de Instagram dedicado. */
    .iab-banner {
      display: none;
      position: fixed;
      inset: 0;
      background: #080808;
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      gap: 22px;
    }
    .iab-banner.show { display: flex; }
    .iab-banner p {
      color: #E8E8E8;
      font-size: 0.9rem;
      line-height: 1.6;
      max-width: 320px;
    }
    .iab-banner strong { color: #C5B358; }
    .iab-continue-btn {
      background: #C5B358;
      color: #080808;
      border: none;
      border-radius: 12px;
      padding: 16px 40px;
      font-size: 0.95rem;
      font-weight: 900;
      font-family: sans-serif;
      cursor: pointer;
    }
    /* ── PRUEBA: iframe en vez de redirect ──
       Antes, irALaApp() hacía window.location.replace(GAS_URL) — el
       navegador pasaba a mostrar "script.google.com" en la barra de
       direcciones, lo cual se ve poco profesional (ej. al mostrarle la
       app a un sponsor). Ahora la app de Apps Script se muestra
       "envuelta" en un <iframe> adentro de esta misma página, así la
       barra de direcciones se queda siempre en huella-runner.vercel.app.
       CONFIRMADO en PC por Esteban (12-13/08/2026): sin el cartel de
       Google, pero "Compartir" no funcionaba — el iframe no tenía
       permiso explícito para usar el Web Share API del celu (se pierde
       por default en un iframe de otro origen). Agregado allow="web-share"
       (y clipboard-write, por si el respaldo de compartir usa portapapeles).
       Falta confirmar en celu real que esto lo arregla del todo, y que
       no aparezcan otros problemas (cookies de sesión cortadas, etc.) —
       si algo no anda, volver al redirect de antes. */
    #app-frame {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="iab-banner" id="iab-banner">
    <p><strong>Un toque y ves cuántos km lleva tu zapatilla.</strong></p>
    <button class="iab-continue-btn" onclick="irALaApp()">Ver mis zapatillas →</button>
  </div>
  <div class="splash" id="splash">
    <img src="./icons/icon-512.png" alt="Huella Runner">
    <div>
      <div class="splash-title">HUELLA <span>RUNNER</span></div>
      <div class="splash-sub">Powered by Huella Runner MDQ</div>
    </div>
    <div class="loader"><div class="loader-bar"></div></div>
  </div>
  <iframe id="app-frame" title="Huella Runner" allow="web-share; clipboard-write"></iframe>
  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwxh1GRAiybZJYM4w82ny7RXwjpraOBKmh8s4jZcIaNFkqMRgZHYe0x8-kNMIIQEintRw/exec';
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .catch(err => console.warn('SW:', err));
    }

    function irALaApp() {
      var banner = document.getElementById('iab-banner');
      if (banner) banner.classList.remove('show');

      var frame = document.getElementById('app-frame');
      frame.addEventListener('load', function() {
        document.getElementById('splash').style.display = 'none';
        frame.style.display = 'block';
      }, { once: true });
      frame.src = GAS_URL + '?v=' + Date.now();
    }

    // Instagram y Facebook agregan su propia marca al user-agent del
    // navegador in-app ("Instagram", "FBAN"/"FBAV"). TikTok también, por
    // si el link circula ahí. Si detectamos alguno, se muestra el cartel
    // fijo (sin cronómetro) y se espera el toque en "Continuar →" — ver
    // la nota arriba de .iab-banner sobre por qué no hay timer acá.
    var ua = navigator.userAgent || '';
    var esNavegadorInApp = /Instagram|FBAN|FBAV|TikTok/i.test(ua);

    if (esNavegadorInApp) {
      document.getElementById('iab-banner').classList.add('show');
    } else {
      setTimeout(irALaApp, 1200);
    }
  </script>
</body>
</html>
