<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C5B358">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HR">
  <title>Huella Runner</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-512.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .splash img {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(197,179,88,0.3);
    }
    .splash-title {
      font-size: 2rem;
      font-weight: 900;
      color: #E8E8E8;
      letter-spacing: -1px;
      text-align: center;
    }
    .splash-title span { color: #C5B358; }
    .splash-sub {
      font-size: 0.65rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .loader {
      width: 36px;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
    }
    .loader-bar {
      width: 40%;
      height: 100%;
      background: #C5B358;
      border-radius: 2px;
      animation: slide 1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    /* ── Aviso "navegador de adentro" (Instagram/Facebook/TikTok) ──
       Esos navegadores in-app no soportan bien "Agregar a pantalla de
       inicio" (ícono genérico, sin pantalla completa real) porque no son
       Chrome/Safari de verdad — son una ventanita que la app te muestra
       sin que salgas de ella. No se puede forzar la salida (las apps lo
       bloquean a propósito), así que se le explica al usuario el paso
       manual. No bloquea el uso: quien no quiera salir puede seguir. */
    .iab-banner {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #111111;
      border-bottom: 1px solid #C5B358;
      padding: 16px 20px;
      text-align: center;
      z-index: 10;
    }
    .iab-banner.show { display: block; }
    .iab-banner p {
      color: #E8E8E8;
      font-size: 0.8rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .iab-banner strong { color: #C5B358; }
    .iab-banner button {
      background: none;
      border: 1px solid #333;
      color: #888;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="iab-banner" id="iab-banner">
    <p>Estás entrando desde Instagram/Facebook. Para que la app se vea e instale bien,
      tocá <strong>⋯</strong> (arriba a la derecha) y elegí <strong>"Abrir en el navegador"</strong>.</p>
    <button onclick="continuarIgual()">Continuar acá igual →</button>
  </div>
  <div class="splash">
    <img src="./icons/icon-512.png" alt="Huella Runner">
    <div>
      <div class="splash-title">HUELLA <span>RUNNER</span></div>
      <div class="splash-sub">Powered by Huella Runner MDQ</div>
    </div>
    <div class="loader"><div class="loader-bar"></div></div>
  </div>
  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwxh1GRAiybZJYM4w82ny7RXwjpraOBKmh8s4jZcIaNFkqMRgZHYe0x8-kNMIIQEintRw/exec';
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .catch(err => console.warn('SW:', err));
    }

    function irALaApp() {
      // replace() en vez de href: reemplaza este paso en el historial en
      // vez de agregar uno. Así, si el usuario aprieta "atrás" desde la
      // app, no queda un escalón intermedio de más donde caer en una
      // pantalla en blanco. (No lo resuelve del todo: el marco interno
      // de Google sigue estando, es una limitación de Apps Script.)
      window.location.replace(GAS_URL + '?v=' + Date.now());
    }

    // Instagram y Facebook agregan su propia marca al user-agent del
    // navegador in-app ("Instagram", "FBAN"/"FBAV"). TikTok también, por
    // si el link circula ahí. Si detectamos alguno, frenamos el redirect
    // automático y mostramos el aviso — el botón "Continuar acá igual"
    // sigue el camino normal para quien no quiera salir de la app.
    var ua = navigator.userAgent || '';
    var esNavegadorInApp = /Instagram|FBAN|FBAV|TikTok/i.test(ua);

    function continuarIgual() {
      document.getElementById('iab-banner').classList.remove('show');
      irALaApp();
    }

    if (esNavegadorInApp) {
      document.getElementById('iab-banner').classList.add('show');
      // Sin redirect automático acá: se espera a que el usuario elija
      // (salir a Chrome/Safari, o tocar "Continuar acá igual").
    } else {
      setTimeout(irALaApp, 1200);
    }
  </script>
</body>
</html>
